name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml from the repo and installs the pinned
      # toolchain automatically; `rustup show` materializes it before cargo runs.
      - name: Install toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The test suite creates the FTS5 schema and executes the actual bm25
      # ranking query against the bundled SQLite on every release target
      # (plan.md sections 1.3 and 13).
      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
