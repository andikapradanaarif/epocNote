[package]
name = "epocnote"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "=0.13.6"
rmcp = { version = "=3.10.0", features = ["server", "transport-io"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
saphyr-parser = "=0.3.4"
sha2 = "=0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
